<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vérifications — Code secret</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      .test-page { max-width: 760px; margin: 0 auto; padding: 48px 0 70px; }
      .test-page h1 { font-size: 42px; }
      .test-summary { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
      .test-list { display: grid; gap: 8px; padding: 0; list-style: none; }
      .test-item { display: flex; justify-content: space-between; gap: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--card); font-size: 12px; }
      .test-item strong { color: var(--green); font-family: "DM Mono", monospace; font-size: 10px; }
      .test-item.fail { color: #994d40; background: #f7ece8; }
      .test-item.fail strong { color: #994d40; }
      .test-actions { margin-top: 20px; }
      #fixture { position: fixed; width: 1px; height: 1px; left: -10px; top: -10px; border: 0; opacity: 0; pointer-events: none; }
    </style>
    <script src="tests.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="./"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>atelier <strong>des couleurs</strong></span></a>
        <span class="edition">CONTRAT <span class="edition-divider">/</span> API 0.2</span>
      </header>
      <main class="test-page">
        <p class="eyebrow">Contrat commun · code-couleurs-1.0</p>
        <h1>Vérifications du jeu</h1>
        <p id="summary" class="test-summary" role="status">Chargement de l’API de test…</p>
        <ol id="results" class="test-list" aria-live="polite"></ol>
        <div class="test-actions"><a class="secondary-button" href="./">Retour au jeu</a></div>
      </main>
      <footer class="footer"><span>Exemples reproductibles du contrat</span><span>CODE SECRET · v1.0</span></footer>
    </div>
    <iframe id="fixture" title="Instance isolée du jeu pour les vérifications" src="./index.html?test=1"></iframe>
  </body>
</html>
